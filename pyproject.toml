[project]
name = "ragforge"
version = "0.1.0"
description = "Production-grade RAG system with multi-tenant org model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "supabase>=2.10.0",
]

[dependency-groups]
app = [
    "datasets>=3.0.0",
    "fastapi[standard]>=0.136.3",
    "langchain-openapi>=0.1.0",
    "langfuse>=4.7.1",
    "pandas>=2.0.0",
    "python-jose[cryptography]>=3.5.0",
    "ragas>=0.4.3",
    "redis>=8.0.0",
    "uvicorn[standard]>=0.49.0",
]

worker = [
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "redis>=8.0.0",
]

dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
